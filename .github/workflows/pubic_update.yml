name: Update VPN Keys / Public-keys
on:
  schedule:
    - cron: '30 */4 * * *' # 4hrs autoupdate +30min СДВИГ
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python public_main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add public_scr.txt
          git commit -m "Auto-update public keys" || exit 0
          git push
