name: Update VPN Keys / RU-whitelist

on:
  schedule:
    - cron: '0 */3 * * *' # Обновление каждые 3 часа
  workflow_dispatch: # Кнопка для ручного запуска

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python main.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scr.txt
          # Сначала коммитим свои изменения, потом делаем rebase, чтобы избежать ошибки "uncommitted changes"
          git commit -m "Update main keys" || echo "No changes to commit"
          git pull origin main --rebase
          git push origin main
