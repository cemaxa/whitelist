name: Update All VPN Keys | Whitelist + Public

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Scripts
        run: |
          python main.py
          python public_main.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scr.txt public_scr.txt
          # Сначала фиксируем изменения локально, чтобы очистить индекс перед rebase
          git commit -m "Auto-update: main and public keys" || echo "No changes to commit"
          # Подтягиваем изменения, если они были в облаке, и ставим свои поверх
          git pull origin main --rebase
          git push origin main
